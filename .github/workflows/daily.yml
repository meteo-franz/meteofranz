name: MeteoFranz giornaliero

on:
  schedule:
    # 07:20 italiane: due orari UTC per gestire automaticamente ora legale/solare.
    - cron: "20 5 * * *"
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Cosa vuoi fare?"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - send_now

permissions:
  contents: write

concurrency:
  group: meteofranz-daily
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NAME: MeteoFranz
      BREVO_LIST_NAME: ${{ vars.BREVO_LIST_NAME }}
      LIVE_SEND: ${{ vars.LIVE_SEND }}

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Controlla l'orario italiano
        id: clock
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          local_hour = datetime.now(ZoneInfo("Europe/Rome")).hour
          print(f"run={'true' if manual or local_hour == 7 else 'false'}")
          PY

      - name: Genera l'edizione
        if: steps.clock.outputs.run == 'true'
        run: python -m meteofranz.main build

      - name: Verifica il progetto
        if: steps.clock.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Pubblica gli output aggiornati nel repository
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/map.png output/newsletter.html output/data.json
          git diff --cached --quiet || git commit -m "Aggiorna MeteoFranz $(date +%F)"
          git push

      - name: Invia subito su richiesta manuale
        if: steps.clock.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && inputs.action == 'send_now'
        run: python -m meteofranz.main send --now

      - name: Programma l'invio giornaliero
        if: steps.clock.outputs.run == 'true' && github.event_name == 'schedule' && env.LIVE_SEND == 'true'
        run: python -m meteofranz.main send
